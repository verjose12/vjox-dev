<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="Galería | VJOX">
<meta property="og:description" content="Consulta las fotos y detalles del producto.">
<meta
  property="og:image"
  content="https://res.cloudinary.com/dvxorpdrd/image/upload/v1784685833/vqvqajlkbpb6iwres7tm.jpg"
  

>
<meta property="og:type" content="website">
<meta property="og:site_name" content="VJOX">

<title>Galería | VJOX</title>
<link rel="stylesheet" href="css/vjox-design.css">
<link rel="stylesheet" href="css/viewer.css?v=2">
</head>
<body>
<header class="vjox-header"><strong>VJOX · Galería</strong></header>
<main>
  <div>
    <div class="title" id="t"></div>
    <div class="muted" id="d"></div>
    <div id="galleryNav" class="vjox-record-nav"></div>
  </div>
  <div class="card">
    <div id="prices" class="muted" style="margin-bottom:8px"></div>

    <div id="g" class="grid"></div>
    <div class="cta" style="margin-top:12px">
      <button class="whats" id="askBtn">Pedir por WhatsApp</button>
      <button id="copyBtn">Copiar link</button>
    </div>
  </div>
</main>
<footer>Hecho con ♥ | VJOX
  <p>
    © 2026 VJOX Ventas. Desarrollado por Veronica J. Narciso.
    Todos los derechos reservados.
  </p>
</footer>

<div
  id="imageLightbox"
  class="image-lightbox hidden"
  aria-hidden="true"
>
  <div class="image-lightbox__content">
    <button
      id="closeImageLightbox"
      class="image-lightbox__close"
      type="button"
      aria-label="Cerrar imagen"
    >
      ×
    </button>

    <img
      id="imageLightboxPhoto"
      class="image-lightbox__photo"
      src=""
      alt=""
    >

    <div
      id="imageLightboxPrice"
      class="image-lightbox__price"
    ></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/database.js"></script>


<script src="js/viewer.js?v=4"></script>

</body>
</html>
