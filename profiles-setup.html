<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Configura tu perfil | VJOX</title>

    <!-- Design System VJOX -->

    <link rel="stylesheet" href="css/vjox-design.css" />
    <link rel="stylesheet" href="css/profile-setup.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <main class="profile-setup">
      <div class="card profile-card">
        <header class="profile-header">
          <h1>Completa tu perfil</h1>

          <p>
            Configura los datos de tu negocio para que tus clientes puedan
            ponerse en contacto contigo.
          </p>
        </header>

        <form id="profileForm">
          <div class="form-group">
            <label for="name">Tu nombre</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Ej. Verónica"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="businessName">Nombre de tu negocio</label>

            <input
              type="text"
              id="businessName"
              name="businessName"
              placeholder="Ej. Botitas Viajeras"
              required
            />
          </div>

          <div class="form-group">
            <label>Giro del negocio</label>

            <div class="business-type-options">
              <label class="business-type-card">
                <input
                  type="radio"
                  name="businessType"
                  value="products"
                  required
                />

                <span class="business-type-card__content">
                  <i class="bi bi-bag"></i>

                  <span class="business-type-card__text">
                    <strong>Venta de productos</strong>
                    <small>
                      Inventario, stock, precios y catálogo de productos.
                    </small>
                  </span>
                </span>
              </label>

              <label class="business-type-card">
                <input
                  type="radio"
                  name="businessType"
                  value="real_estate"
                  required
                />

                <span class="business-type-card__content">
                  <i class="bi bi-house-door"></i>

                  <span class="business-type-card__text">
                    <strong>Inmobiliaria</strong>
                    <small>
                      Propiedades, galerías, precios y ubicaciones.
                    </small>
                  </span>
                </span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="whatsappPhone">WhatsApp</label>

            <input
              type="tel"
              id="whatsappPhone"
              name="whatsappPhone"
              placeholder="Ej. 6561234567"
              autocomplete="tel"
              required
            />
          </div>

          <button type="submit" class="btn btn--primary btn--full btn--lg">
            Guardar y continuar
          </button>

          <p id="profileStatus"></p>
        </form>

        <div id="facebookModal" class="setup-modal" aria-hidden="true">
          <div class="setup-modal__backdrop"></div>

          <div class="setup-modal__content">
            <div class="setup-modal__icon">
              <i class="bi bi-facebook"></i>
            </div>

            <span class="setup-modal__badge"> Opcional </span>

            <h2>Conecta tu Facebook</h2>

            <p>
              Vincula la página de Facebook de tu negocio para publicar tus
              productos directamente desde VJOX.
            </p>

            <button
              id="connectFacebookBtn"
              type="button"
              class="btn btn--primary btn--full"
            >
              Conectar Facebook
            </button>

            <button
              id="skipFacebookBtn"
              type="button"
              class="btn btn--ghost btn--full"
            >
              Ahora no
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/database.js"></script>
    <script src="js/profile-setup.js"></script>
  </body>
</html>
