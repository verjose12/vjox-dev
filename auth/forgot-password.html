<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recuperar contraseña | VJOX</title>

    <link rel="stylesheet" href="../css/vjox-design.css" />
    <link rel="stylesheet" href="./auth.css" />
    <link rel="manifest" href="../manifest.json" />
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card">

        <div class="auth-brand">
          <h1>VJOX</h1>
          <p>
            Ingresa tu correo y te enviaremos un enlace para recuperar tu contraseña.
          </p>
        </div>

        <form id="forgotPasswordForm" class="auth-form">

          <div class="form-group">
            <label for="forgotEmail">Correo electrónico</label>

            <input
              id="forgotEmail"
              name="email"
              type="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <button
            id="forgotPasswordButton"
            class="auth-button"
            type="submit"
          >
            Enviar enlace
          </button>

          <p
            id="forgotPasswordStatus"
            class="auth-status"
            aria-live="polite"
          ></p>

        </form>

        <p class="auth-link">
          <a href="./login.html">Volver a iniciar sesión</a>
        </p>

      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="./auth.js"></script>
  </body>
</html>
