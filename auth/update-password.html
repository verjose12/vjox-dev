<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nueva contraseña | VJOX</title>

    <link rel="stylesheet" href="../css/vjox-design.css" />
    <link rel="stylesheet" href="./auth.css" />
    <link rel="manifest" href="../manifest.json" />
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-brand">
          <h1>VJOX</h1>
          <p>Crea una nueva contraseña para tu cuenta.</p>
        </div>

        <form id="updatePasswordForm" class="auth-form">
          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>

            <input
              id="newPassword"
              type="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>

            <input
              id="confirmPassword"
              type="password"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>

          <button id="updatePasswordButton" class="auth-button" type="submit">
            Guardar nueva contraseña
          </button>

          <p
            id="updatePasswordStatus"
            class="auth-status"
            aria-live="polite"
          ></p>
        </form>

        <p id="requestNewRecovery" class="auth-link" style="display: none">
          <a href="./forgot-password.html"> Solicitar un nuevo enlace </a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/database.js"></script>
    <script src="./auth.js"></script>
  </body>
</html>
