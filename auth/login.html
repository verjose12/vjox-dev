<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Iniciar sesión | VJOX</title>
  <link rel="stylesheet" href="../css/vjox-design.css">
  <link rel="stylesheet" href="./auth.css" />
  <link rel="manifest" href="../manifest.json">
</head>

<body>
  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">
        <h1>VJOX</h1>
        <p>Administra tus productos y publicaciones.</p>
      </div>

      <form id="loginForm" class="auth-form">

        <div class="form-group">
          <label for="loginEmail">
            Correo electrónico
          </label>

          <input
            id="loginEmail"
            name="email"
            type="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Contraseña
          </label>

          <input
            id="loginPassword"
            name="password"
            type="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            minlength="6"
            required
          />
        </div>

        <button
          id="loginButton"
          class="auth-button"
          type="submit"
        >
          Iniciar sesión
        </button>

        <p
          id="loginStatus"
          class="auth-status"
          aria-live="polite"
        ></p>

      </form>

      <p class="auth-link">
        ¿Todavía no tienes cuenta?

        <a href="./register.html">
          Crear una cuenta
        </a>
      </p>

      <a class="gallery-link" href="../index.html">
        Explorar galería
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/database.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
